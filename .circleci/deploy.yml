# DEPLOY PIPELINE: what runs when someone clicks Deploy or Promote on the
# CircleCI Deploys page. Set this file as the project's deploy pipeline
# (Project Settings > Deploys > Deploy Pipeline). See docs/SETUP.md.
#
# CircleCI passes in what the person picked in the UI:
#   pipeline.deploy.environment_name  -> dev | test | stage | prod
#   pipeline.deploy.target_version    -> the version (commit) to deploy
#
# One workflow per environment. Stage and prod require an approval from the
# environment's authorized group before anything changes.
version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.4.1

executors:
  terraform:
    docker:
      - image: cimg/aws:2025.01
    resource_class: small

commands:
  install-terraform:
    parameters:
      version:
        type: string
        default: "1.10.5"
    steps:
      - run:
          name: Install Terraform << parameters.version >>
          command: |
            curl -sSfL -o /tmp/tf.zip \
              "https://releases.hashicorp.com/terraform/<< parameters.version >>/terraform_<< parameters.version >>_linux_amd64.zip"
            sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
            terraform version

jobs:
  notify-approvers:
    executor: terraform
    parameters:
      environment:
        type: string
      version:
        type: string
    steps:
      - run:
          name: Notify approvers in Teams
          command: |
            if [ -z "${TEAMS_WEBHOOK_URL:-}" ]; then
              echo "Teams notification skipped"
              exit 0
            fi
            python3 -c 'import json, os, sys, urllib.request
            env, version, link = sys.argv[1], sys.argv[2], sys.argv[3]
            payload = {"type": "message", "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive", "contentUrl": None, "content": {"$schema": "http://adaptivecards.io/schemas/adaptive-card.json", "type": "AdaptiveCard", "version": "1.2", "body": [{"type": "TextBlock", "text": "Approval needed for " + env, "weight": "Bolder", "wrap": True}, {"type": "TextBlock", "text": "Version " + version + " is waiting. Open the workflow to approve: " + link, "wrap": True}]}}]}
            req = urllib.request.Request(os.environ["TEAMS_WEBHOOK_URL"], data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
            try:
                urllib.request.urlopen(req, timeout=15)
            except Exception as exc:
                print("Teams notification skipped")
                print(exc)
            ' "<< parameters.environment >>" "<< parameters.version >>" "https://app.circleci.com/pipelines/workflows/${CIRCLE_WORKFLOW_ID}" || echo "Teams notification skipped"
            exit 0

  deploy-from-ui:
    executor: terraform
    parameters:
      environment:
        type: string
    steps:
      - checkout
      - run:
          name: Check out the exact version picked in the UI
          command: |
            git fetch --all --tags
            git checkout "<< pipeline.deploy.target_version >>"
            chmod +x scripts/*.sh
      - install-terraform
      - aws-cli/setup:
          role_arn: ${AWS_ROLE_ARN}
          region: ${AWS_REGION}
          role_session_name: circleci-deploy-<< parameters.environment >>
          session_duration: "3600"
      - run:
          name: Record deploy (Deploys page)
          command: |
            circleci run release plan infra-<< parameters.environment >> \
              --environment-name=<< parameters.environment >> \
              --component-name=ocsd-poc-infra \
              --target-version="<< pipeline.deploy.target_version >>"
      - run:
          name: Deploy all stacks to << parameters.environment >>
          command: |
            grep -v '^#' scripts/stacks.txt | while read -r stack; do
              [ -z "$stack" ] && continue
              echo "=== ${stack} -> << parameters.environment >> ==="
              scripts/tf.sh "$stack" << parameters.environment >> apply
            done
      - run:
          name: Mark deploy running
          command: circleci run release update infra-<< parameters.environment >> --status=RUNNING
      - run:
          name: Mark deploy succeeded
          command: circleci run release update infra-<< parameters.environment >> --status=SUCCESS
          when: on_success
      - run:
          name: Mark deploy failed
          command: |
            circleci run release update infra-<< parameters.environment >> \
              --status=FAILED --failure-reason="Terraform apply failed, see job log"
          when: on_fail

workflows:
  deploy-dev:
    when:
      equal: [dev, << pipeline.deploy.environment_name >>]
    jobs:
      - deploy-from-ui:
          environment: dev
          context: [ocsd-aws-dev]

  deploy-test:
    when:
      equal: [test, << pipeline.deploy.environment_name >>]
    jobs:
      - deploy-from-ui:
          environment: test
          context: [ocsd-aws-test]

  deploy-stage:
    when:
      equal: [stage, << pipeline.deploy.environment_name >>]
    jobs:
      - notify-approvers:
          name: notify-stage
          environment: stage
          version: << pipeline.deploy.target_version >>
          context: [ocsd-notify]
      - approve-stage:
          type: approval
          context: [ocsd-aws-stage]
      - deploy-from-ui:
          environment: stage
          context: [ocsd-aws-stage]
          requires: [approve-stage]

  deploy-prod:
    when:
      equal: [prod, << pipeline.deploy.environment_name >>]
    jobs:
      - notify-approvers:
          name: notify-prod
          environment: prod
          version: << pipeline.deploy.target_version >>
          context: [ocsd-notify]
      - approve-prod:
          type: approval
          context: [ocsd-aws-prod]
      - deploy-from-ui:
          environment: prod
          context: [ocsd-aws-prod]
          requires: [approve-prod]
