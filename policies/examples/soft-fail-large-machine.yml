version: 2.1

jobs:
  sonarqube-scan:
    docker:
      - image: cimg/node:22.11
    resource_class: medium
    steps:
      - checkout
      - run: echo "scan"
  build:
    docker:
      - image: cimg/base:current
    resource_class: xlarge
    steps:
      - checkout
      - run: echo "build"

workflows:
  main:
    jobs:
      - sonarqube-scan
      - build:
          requires: [sonarqube-scan]
